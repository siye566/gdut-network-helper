name: Build Windows installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Flutter stable
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows host
        run: |
          node tool/bootstrap.mjs --platforms=windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package installer and portable archive
        run: ./tool/package-windows.ps1
      - name: Verify installation and process startup
        run: |
          $installer = @(Get-ChildItem -LiteralPath dist -Filter '*-setup.exe')
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'gdut-helper-install-check'
          $setup = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$installDir`"") -Wait -PassThru -WindowStyle Hidden
          if ($setup.ExitCode -ne 0) { throw "Installer failed: $($setup.ExitCode)" }
          $exe = Join-Path $installDir 'gdut_network_helper.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Installed executable was not found.' }
          $app = Start-Process -FilePath $exe -WorkingDirectory $installDir -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 8
            $app.Refresh()
            if ($app.HasExited) { throw "Installed application exited early: $($app.ExitCode)" }
            'Installer completed and application process remained running.' | Set-Content -LiteralPath 'dist/installation-check.txt'
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
          $uninstall = Start-Process -FilePath (Join-Path $installDir 'unins000.exe') -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw 'Uninstaller failed.' }
      - name: Record build versions
        run: |
          flutter --version --machine | Set-Content -LiteralPath dist/flutter-version.json -Encoding utf8
          Copy-Item -LiteralPath pubspec.lock -Destination dist/pubspec.lock
          '${{ github.sha }}' | Set-Content -LiteralPath dist/source-commit.txt
      - name: Upload Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gdut-network-helper-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
